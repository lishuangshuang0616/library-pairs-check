[package]
name = "library-pair-check"
version = "0.7.0"
edition = "2021"
description = "Barcode fingerprint comparison for DNBelab C4 cDNA and oligo FASTQs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
